name: Test

on:
  push:
    branches: [main]
  pull_request:

# Test jobs only need to read the repo; keep the token least-privilege
# (release.yml widens its own permissions where it must).
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group lint --group typing
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy llama_index/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group test
      - name: Unit tests
        run: uv run pytest tests/ -v

  # The package pins nimble-python>=1.0.0,<2.0.0 (the V2 Agent API resource
  # first ships in 1.0.0). Run the suite at the pinned floor too, so a floor
  # break can't hide behind the latest resolution.
  test-sdk-min:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group test
      - name: Pin nimble-python to the minimum supported release
        run: uv pip install nimble-python==1.0.0
      - name: Unit tests (SDK floor)
        run: uv run --no-sync pytest tests/ -v
